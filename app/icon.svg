<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bgGrad" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#0F172A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E293B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498DB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6ECB63;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="100" height="100" rx="20" fill="url(#bgGrad)" stroke="url(#textGrad)" stroke-width="2"/>

  <!-- The letters forming a 'D' shape -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" fill="url(#textGrad)" text-anchor="middle">
    <!-- Vertical Spine -->
    <text x="25" y="30">D</text>
    <text x="25" y="55">H</text>
    <text x="25" y="80">A</text>
    
    <!-- Top Curve -->
    <text x="45" y="30">Y</text>
    <text x="65" y="38">A</text>
    
    <!-- Rightmost point of D -->
    <text x="75" y="55">L</text>
    
    <!-- Bottom Curve -->
    <text x="65" y="72">A</text>
    <text x="45" y="80">N</text>
  </g>
</svg>
